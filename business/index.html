<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rodood Business Web</title>
<meta name="description" content="Web prototype of Rodood Business: manage service requests and set up services, prices and journeys for any business.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600;700&family=Readex+Pro:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..600,0..1,0">
<style>
/* Rodood design system — dark-first canvas, translucent surfaces, Poppins only,
   pink for primary action, the signature gradient as the one loud element per screen.
   Layout: two phones (client app · Rodood Business) joined by a live sync rail; spec notes below. */
:root{
  --orange:#F5821F; --pink:#E0328C; --purple:#9B1FE0; --navy:#0A0B2A;
  --grad:linear-gradient(90deg,#F5821F 0%,#E0328C 50%,#9B1FE0 100%);
  --grad-v:linear-gradient(180deg,#F5821F 0%,#E0328C 55%,#9B1FE0 100%);
  --wa:#25D366;
  --font:'Poppins','Readex Pro',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;

  /* type scale (px) */
  --fs-h1:24px; --fs-h2:20px; --fs-body-lg:17px; --fs-body:16px; --fs-body-sm:15px; --fs-label:13px; --fs-micro:11px;
  --ls-ui:.4px;
  /* spacing 5px base */
  --sp1:5px; --sp2:10px; --sp3:15px; --sp4:20px; --sp5:30px; --gutter:15px;
  /* radius */
  --r-md:12px; --r-lg:24px; --r-xl:32px; --r-pill:500px;
  /* elevation */
  --shadow-float:0 0 30px rgba(0,0,0,.20); --shadow-pop:0 8px 32px rgba(0,0,0,.45); --glow:0 0 24px rgba(224,50,140,.35);

  /* motion tokens (mirror in Flutter: RodoodMotion) */
  --d-page:260ms; --e-page:ease;
  --d-sheet:300ms; --e-sheet:cubic-bezier(.2,.8,.2,1);
  --d-push:400ms; --e-push:cubic-bezier(.2,.9,.3,1.1);
  --e-out:cubic-bezier(.2,.8,.2,1);

  /* dark (default) */
  --canvas:#0A0B2A; --elev:#1B1C3E;
  --s1:rgba(255,255,255,.03); --s2:rgba(255,255,255,.05); --s3:rgba(255,255,255,.10);
  --ring:inset 0 0 0 1px rgba(255,255,255,.05); --b2:rgba(255,255,255,.10); --b3:rgba(255,255,255,.18);
  --tp:#FFFFFF; --ts:#8E8DA3; --tpur:#C77DF2; --tt:rgba(255,255,255,.5); --tpur:#C77DF2;
  --pink-tx:#F04F9E; --orange-tx:#F79A45; --on-pink:#FFFFFF;
  --tint-pink:rgba(224,50,140,.16); --tint-orange:rgba(245,130,31,.15); --tint-purple:rgba(155,31,224,.18);
  --bad:#F0565B; --tint-bad:rgba(229,72,77,.16);
  --phone-edge:#000; --scrim:rgba(3,3,15,.55);
  --paper:#FFFFFF; --paper-tx:#0A0B2A; --paper-ts:#6E6D7A; --paper-line:rgba(10,11,42,.12);
  --w-bg:#0B141A; --w-head:#1F2C34; --w-in:#202C33; --w-out:#005C4B; --w-tp:#E9EDEF; --w-ts:#8696A0; --w-accent:#00A884; --w-bar:#1F2C34;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
  --canvas:#F6F6FA; --elev:#FFFFFF;
  --s1:rgba(10,11,42,.03); --s2:rgba(10,11,42,.045); --s3:rgba(10,11,42,.09);
  --ring:inset 0 0 0 1px rgba(10,11,42,.07); --b2:rgba(10,11,42,.13); --b3:rgba(10,11,42,.22);
  --tp:#0A0B2A; --ts:#5F5E6E; --tt:rgba(10,11,42,.55); --tpur:#8617C6;
  --pink-tx:#C21873; --orange-tx:#B85B06;
  --tint-pink:rgba(224,50,140,.10); --tint-orange:rgba(245,130,31,.13); --tint-purple:rgba(155,31,224,.10);
  --bad:#D93C42; --tint-bad:rgba(217,60,66,.10);
  --phone-edge:#05060F; --scrim:rgba(5,6,15,.45);
  --shadow-pop:0 8px 32px rgba(10,11,42,.18); --shadow-float:0 0 30px rgba(10,11,42,.10);
  --w-bg:#EFEAE2; --w-head:#F7F7F7; --w-in:#FFFFFF; --w-out:#D9FDD3; --w-tp:#111B21; --w-ts:#667781; --w-accent:#008069; --w-bar:#F0F2F5;
  color-scheme:light;
  }
}
:root[data-theme="light"]{
  --canvas:#F6F6FA; --elev:#FFFFFF;
  --s1:rgba(10,11,42,.03); --s2:rgba(10,11,42,.045); --s3:rgba(10,11,42,.09);
  --ring:inset 0 0 0 1px rgba(10,11,42,.07); --b2:rgba(10,11,42,.13); --b3:rgba(10,11,42,.22);
  --tp:#0A0B2A; --ts:#5F5E6E; --tt:rgba(10,11,42,.55); --tpur:#8617C6;
  --pink-tx:#C21873; --orange-tx:#B85B06;
  --tint-pink:rgba(224,50,140,.10); --tint-orange:rgba(245,130,31,.13); --tint-purple:rgba(155,31,224,.10);
  --bad:#D93C42; --tint-bad:rgba(217,60,66,.10);
  --phone-edge:#05060F; --scrim:rgba(5,6,15,.45);
  --shadow-pop:0 8px 32px rgba(10,11,42,.18); --shadow-float:0 0 30px rgba(10,11,42,.10);
  --w-bg:#EFEAE2; --w-head:#F7F7F7; --w-in:#FFFFFF; --w-out:#D9FDD3; --w-tp:#111B21; --w-ts:#667781; --w-accent:#008069; --w-bar:#F0F2F5;
  color-scheme:light;
}
*{margin:0;padding:0;box-sizing:border-box}
html{font-size:15px}
body{font-family:var(--font);background:var(--canvas);color:var(--tp);-webkit-font-smoothing:antialiased;letter-spacing:var(--ls-ui);padding-inline:16px;transition:background .25s}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;letter-spacing:inherit;touch-action:manipulation}
input,textarea{font-family:inherit;color:inherit;letter-spacing:inherit}
:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
.ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;line-height:1;display:inline-block;font-size:22px;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;user-select:none;letter-spacing:0;white-space:nowrap;direction:ltr}
.ms.f{font-variation-settings:'FILL' 1,'wght' 500,'GRAD' 0,'opsz' 24}

/* ---------- Deck ---------- */
.deck{max-width:1000px;margin:0 auto;padding-block:34px 6px;text-align:center}
.deck .eyebrow{font-size:var(--fs-label);letter-spacing:var(--ls-ui);text-transform:uppercase;color:var(--ts)}
.lockup{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:14px}
.lockup img{height:36px;width:36px}
.lockup b{font-size:30px;font-weight:200;letter-spacing:-.2px}
.deck p{font-weight:300;color:var(--ts);max-width:60ch;margin:12px auto 0;line-height:1.45;font-size:var(--fs-body-sm);text-wrap:pretty}
.ctrls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}
.seg{display:flex;gap:4px;background:var(--s2);box-shadow:var(--ring);border-radius:var(--r-pill);padding:4px}
.seg button{display:flex;align-items:center;gap:6px;height:36px;padding:0 15px;border-radius:var(--r-pill);font-size:var(--fs-label);color:var(--ts);transition:background .2s,color .2s}
.seg button .ms{font-size:18px}
.seg button.on{background:var(--pink);color:var(--on-pink)}
.ghost{display:flex;align-items:center;gap:6px;height:44px;padding:0 18px;border-radius:var(--r-pill);font-size:var(--fs-label);color:var(--ts);box-shadow:inset 0 0 0 1px var(--b2)}
.ghost .ms{font-size:18px}
.viewseg{display:none}

/* ---------- Stage ---------- */
.stage{display:flex;justify-content:center;align-items:flex-start;padding-block:28px 30px;max-width:1040px;margin:0 auto}
.dev{display:flex;flex-direction:column;align-items:center;gap:12px;min-width:0}
.devlabel{display:flex;align-items:center;gap:8px;font-size:var(--fs-label);color:var(--ts)}
.devlabel .chipdot{width:8px;height:8px;border-radius:50%}
.phone{width:380px;max-width:100%;border:10px solid var(--phone-edge);border-radius:48px;box-shadow:var(--shadow-pop),0 0 0 1px var(--b2);overflow:hidden;position:relative;transition:box-shadow .4s}
.phone.nudge{box-shadow:var(--shadow-pop),0 0 0 3px var(--pink),var(--glow)}
.notch{position:absolute;top:9px;left:50%;transform:translateX(-50%);width:100px;height:26px;border-radius:var(--r-pill);background:var(--phone-edge);z-index:80}

/* sync rail */
.rail{width:190px;flex:none;display:flex;flex-direction:column;align-items:center;padding-top:150px;gap:15px}
.rail h3{font-size:var(--fs-micro);letter-spacing:var(--ls-ui);text-transform:uppercase;color:var(--ts);font-weight:400}
.track{position:relative;width:150px;height:30px}
.track::before{content:'';position:absolute;left:0;right:0;top:14px;height:2px;background:repeating-linear-gradient(90deg,var(--b3) 0 6px,transparent 6px 11px)}
.track .end{position:absolute;top:8px;width:14px;height:14px;border-radius:50%;background:var(--canvas);box-shadow:inset 0 0 0 2px var(--b3)}
.track .end.l{left:-7px}.track .end.r{right:-7px}
.packet{position:absolute;top:9px;left:0;width:12px;height:12px;border-radius:50%;background:var(--grad);box-shadow:var(--glow);opacity:0}
.packet.go-r{animation:pk-r .9s var(--e-out) forwards}
.packet.go-l{animation:pk-l .9s var(--e-out) forwards}
@keyframes pk-r{0%{transform:translateX(-6px) scale(.4);opacity:0}15%{opacity:1;transform:translateX(10px) scale(1)}85%{opacity:1}100%{transform:translateX(144px) scale(.5);opacity:0}}
@keyframes pk-l{0%{transform:translateX(144px) scale(.4);opacity:0}15%{opacity:1;transform:translateX(128px) scale(1)}85%{opacity:1}100%{transform:translateX(-6px) scale(.5);opacity:0}}
.feed{list-style:none;display:flex;flex-direction:column;gap:10px;width:100%}
.feed li{font-size:var(--fs-micro);line-height:1.45;color:var(--ts);background:var(--s2);box-shadow:var(--ring);border-radius:var(--r-md);padding:10px 12px;animation:feedin .45s var(--e-push)}
.feed li b{display:flex;align-items:center;gap:4px;font-weight:500;color:var(--tp);margin-bottom:2px}
.feed li b .ms{font-size:14px}
.feed .empty{background:none;box-shadow:none;text-align:center;animation:none}
@keyframes feedin{from{opacity:0;transform:translateY(-8px) scale(.97)}}

/* ---------- Phone viewport ---------- */
.vp{position:relative;height:760px;overflow:hidden;background:var(--canvas);color:var(--tp);font-size:var(--fs-body-sm)}
.sbar{position:absolute;top:0;left:0;right:0;height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 28px 0 32px;font-size:14px;font-weight:600;z-index:70;pointer-events:none;letter-spacing:0}
.sbar .ic{display:flex;gap:4px}.sbar .ms{font-size:16px}
.screens{position:absolute;inset:0}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--canvas)}
.scr .top{height:46px;flex:none}
.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;padding-bottom:30px}
.scroll::-webkit-scrollbar{display:none}
.vp.has-nav .scroll{padding-bottom:100px}
.a-push{animation:pg-in var(--d-page) var(--e-page)}
.a-pop{animation:pg-back var(--d-page) var(--e-page)}
.a-fade{animation:fade .22s ease}
@keyframes pg-in{from{opacity:0;transform:translateX(14px)}}
@keyframes pg-back{from{opacity:0;transform:translateX(-14px)}}
@keyframes fade{from{opacity:0}}
.a-push .stg>*,.a-fade .stg>*,.a-pop .stg>*{animation:rise .44s var(--e-out) both;animation-delay:calc(var(--i,0) * 38ms + 50ms)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}

/* bottom nav */
.bnav{position:absolute;left:0;right:0;bottom:0;display:flex;padding:6px 5px 22px;background:color-mix(in srgb,var(--canvas) 84%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 -1px 0 var(--b2);z-index:30;transition:transform .32s var(--e-out)}
.vp:not(.has-nav) .bnav{transform:translateY(110%)}
.bnav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:52px;font-size:var(--fs-micro);color:var(--ts);position:relative}
.bnav button .ms{font-size:24px;transition:transform .25s var(--e-push)}
.bnav button.on{color:var(--pink-tx)}
.bnav button.on .ms{font-variation-settings:'FILL' 1,'wght' 500,'GRAD' 0,'opsz' 24;transform:translateY(-1px) scale(1.06)}
.bnav .bdg{position:absolute;top:2px;left:calc(50% + 7px);min-width:18px;height:18px;padding:0 5px;border-radius:var(--r-pill);background:var(--orange);color:var(--navy);font-size:var(--fs-micro);font-weight:600;display:grid;place-items:center;letter-spacing:0}
.bdg.bump{animation:bump .5s var(--e-push)}
@keyframes bump{0%{transform:scale(.4)}60%{transform:scale(1.25)}100%{transform:scale(1)}}

/* sheet */
.scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity var(--d-sheet);z-index:50}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow-y:auto;scrollbar-width:none;border-radius:var(--r-xl) var(--r-xl) 0 0;background:var(--elev);transform:translateY(102%);transition:transform var(--d-sheet) var(--e-sheet);padding:10px 20px 30px;z-index:51;box-shadow:var(--shadow-pop)}
.sheet .grab{width:40px;height:5px;border-radius:5px;background:var(--b3);margin:0 auto 18px}
.vp.sheet-on .scrim{opacity:1;pointer-events:auto}
.vp.sheet-on .sheet{transform:none}
.sheet h3{font-size:var(--fs-h2);font-weight:600;margin-bottom:5px;letter-spacing:0}
.sheet .sub{font-size:var(--fs-label);color:var(--ts);line-height:1.45;margin-bottom:20px}

/* push banner */
.push{position:absolute;top:8px;left:10px;right:10px;z-index:75;display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:var(--r-lg);background:color-mix(in srgb,var(--elev) 90%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:var(--shadow-pop),var(--ring);transform:translateY(-140%);opacity:0;transition:transform var(--d-push) var(--e-push),opacity .25s;cursor:pointer;text-align:left}
.push.show{transform:none;opacity:1}
.push .pi{width:38px;height:38px;flex:none;display:grid;place-items:center}
.push .pi img{width:38px;height:38px}
.push .pt{min-width:0;flex:1}
.push .pt b{display:flex;justify-content:space-between;font-size:var(--fs-label);font-weight:600}
.push .pt b i{font-style:normal;font-weight:400;color:var(--ts)}
.push .pt span{display:block;font-size:var(--fs-label);line-height:1.4;margin-top:2px;color:var(--ts)}

/* toast */
.toast{position:absolute;left:50%;bottom:110px;transform:translate(-50%,20px);opacity:0;transition:transform .35s var(--e-push),opacity .25s;z-index:72;background:var(--elev);color:var(--tp);box-shadow:var(--shadow-pop),var(--ring);font-size:var(--fs-label);padding:11px 16px;border-radius:var(--r-pill);white-space:nowrap;display:flex;gap:8px;align-items:center;pointer-events:none;max-width:92%}
.toast .ms{font-size:18px;color:var(--pink-tx)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.vp:not(.has-nav) .toast{bottom:40px}

/* ---------- Core components ---------- */
.hd{display:flex;align-items:center;gap:12px;padding:6px var(--gutter) 12px;flex:none}
.hd .t{flex:1;min-width:0}
.hd .t h1{font-size:var(--fs-h2);font-weight:600;letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.hd .t h1 .scrname{color:var(--ts);font-weight:400;font-size:var(--fs-body)}
.hd .t small{font-weight:300;display:block;font-size:var(--fs-label);color:var(--ts);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:44px;height:44px;border-radius:50%;background:var(--s2);box-shadow:var(--ring);display:grid;place-items:center;flex:none;color:var(--tp);position:relative;transition:background .2s,transform .15s}
.ib:active{transform:scale(.94);background:var(--s3)}
.ib .ms{font-size:22px}
.ib .dotb{position:absolute;top:9px;right:10px;width:9px;height:9px;border-radius:50%;background:var(--orange);box-shadow:0 0 0 2px var(--canvas)}
.pad{padding:0 var(--gutter)}
.sec{font-size:var(--fs-micro);font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--ts);margin:24px var(--gutter) 10px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:50px;border-radius:var(--r-pill);font-size:var(--fs-body);font-weight:500;transition:transform .15s,opacity .2s,background .2s,box-shadow .2s}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn .ms{font-size:20px}
.btn.pri{background:var(--pink);color:var(--on-pink)}
.btn.pri.glow{box-shadow:var(--glow)}
.btn.sec2{background:var(--s2);box-shadow:inset 0 0 0 1px var(--b2);color:var(--tp)}
.btn.outline{box-shadow:inset 0 0 0 1px var(--b3);color:var(--tp)}
.btn.sm{height:44px;font-size:var(--fs-body-sm)}
.btn.danger{color:var(--bad)}
.row2{display:flex;gap:10px}
.row2>*{flex:1}
/* badges (24px pills) */
.chip{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 10px;border-radius:var(--r-pill);font-size:var(--fs-micro);font-weight:500;white-space:nowrap;background:var(--s3);color:var(--tp)}
.chip .ms{font-size:14px}
/* semantics (Rodood): orange = a person is needed, purple = Noor/AI, neutral = waiting / informational. Pink is never a status. */
.w-hu{background:var(--tint-orange);color:var(--orange-tx)}
.w-ai{background:var(--tint-purple);color:var(--tpur)}
.w-nt{background:var(--s3);color:var(--tp)}
.w-bad{background:var(--tint-bad);color:var(--bad)}
.card{background:var(--s2);box-shadow:var(--ring);border-radius:var(--r-lg);padding:20px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:10px 15px;font-size:var(--fs-label)}
.kv dt{color:var(--ts)} .kv dd{text-align:right;min-width:0;overflow-wrap:anywhere}
.empty-note{font-size:var(--fs-body-sm);color:var(--ts);text-align:center;padding:30px 15px}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:var(--fs-label);font-weight:500;flex:none;color:var(--tp);background:var(--s3);position:relative;letter-spacing:0}
.av.ai::before,.tav.ai::before{content:'';position:absolute;inset:-3px;border-radius:50%;padding:2px;background:var(--grad);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.av .chn{position:absolute;right:-3px;bottom:-3px;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;box-shadow:0 0 0 2px var(--canvas);color:#fff;background:var(--s3)}
.av .chn.wa{background:var(--wa)}
.av .chn.app{background:var(--pink)}
.av .chn .ms{font-size:11px}
.tav{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--s3);color:var(--tp);font-size:var(--fs-label);font-weight:600;position:relative;letter-spacing:0}
.tav.sm{width:38px;height:38px}

/* ---------- Timeline ---------- */
.tl{list-style:none;display:flex;flex-direction:column}
.tn{display:grid;grid-template-columns:32px 1fr;column-gap:15px;position:relative;padding-bottom:20px}
.tn:last-child{padding-bottom:0}
.tn .node{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;position:relative;z-index:1;background:var(--canvas);box-shadow:inset 0 0 0 1.5px var(--b2);color:var(--ts)}
.tn .node .ms{font-size:17px}
.tn .node svg{width:15px;height:15px}
.tn .node svg path{fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24;stroke-dashoffset:0}
.tn .ln{position:absolute;left:15px;top:35px;bottom:3px;width:2px;background:var(--b2);border-radius:2px;overflow:hidden}
.tn .ln::after{content:'';position:absolute;inset:0;background:var(--pink);transform-origin:top;transform:scaleY(0)}
.tn:last-child .ln{display:none}
.tn.done .ln::after,.tn.skip .ln::after{transform:scaleY(1)}
.tn.skip .ln::after{opacity:.35}
.tn.done .node{background:var(--pink);color:var(--on-pink);box-shadow:none}
.tn.fresh .node{animation:pop .5s var(--e-push)}
.tn.fresh .node svg path{animation:draw .4s .12s ease-out both}
.tn.fresh .ln::after{animation:fill .6s .3s var(--e-out) both}
@keyframes draw{from{stroke-dashoffset:24}}
@keyframes pop{0%{transform:scale(.55)}100%{transform:scale(1)}}
@keyframes fill{from{transform:scaleY(0)}}
.tn.cur .node{--nc:var(--ts);color:var(--tp);background:var(--s2);box-shadow:inset 0 0 0 2px var(--nc)}
.tn.cur .node::before{content:'';position:absolute;inset:-1px;border-radius:50%;border:2px solid var(--nc);animation:ring 1.8s ease-out infinite}
/* business view: the team's turn needs a person */
.tn.cur.who-team .node{--nc:var(--orange);background:var(--tint-orange);color:var(--orange-tx)}
/* client view: the client's turn needs a person */
.anfal .tn.cur.who-team .node{--nc:var(--ts);background:var(--s2);color:var(--tp)}
.anfal .tn.cur.who-client .node{--nc:var(--orange);background:var(--tint-orange);color:var(--orange-tx)}
@keyframes ring{0%{transform:scale(1);opacity:.6}100%{transform:scale(1.55);opacity:0}}
.tn.skip{opacity:.5}
.tn.skip .tb b{text-decoration:line-through;text-decoration-thickness:1px}
.tn.cond .node{box-shadow:none;border:1.5px dashed var(--b3)}
.tn.rej .node{background:var(--bad);color:#fff;box-shadow:none}
.tn.redo .node{--nc:var(--orange) !important;background:var(--tint-orange) !important;color:var(--orange-tx) !important}
.tb{min-width:0;padding-top:5px}
.tb b{display:block;font-size:var(--fs-body-sm);font-weight:400;line-height:1.3}
.tb small{font-weight:300;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:var(--fs-label);color:var(--ts);margin-top:3px;line-height:1.35}
.tn.cur .tb b{font-weight:500}

/* ---------- Business (Rodood) ---------- */
.brand{display:flex;align-items:center;gap:9px}
.brand img{width:28px;height:28px}
.brand b{font-size:var(--fs-h2);font-weight:600;letter-spacing:-.2px}
.brand span{color:var(--ts);font-size:var(--fs-body-sm)}
.tabs2{display:flex;gap:4px;margin:0 var(--gutter);background:var(--s2);box-shadow:var(--ring);border-radius:var(--r-pill);padding:4px;position:relative}
.tabs2 button{flex:1;height:38px;border-radius:var(--r-pill);font-size:var(--fs-body-sm);color:var(--ts);position:relative;z-index:1;transition:color .25s}
.tabs2 button.on{color:var(--on-pink)}
.tabs2 .thumb{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 6px);border-radius:var(--r-pill);background:var(--pink);transition:transform .32s var(--e-push)}
.tabs2.right .thumb{transform:translateX(calc(100% + 4px))}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:15px var(--gutter) 0}
.sum button{text-align:left;border-radius:20px;padding:13px 13px 12px;background:var(--s2);box-shadow:var(--ring);transition:box-shadow .2s,background .2s}
.sum button.on{box-shadow:inset 0 0 0 1.5px var(--pink);background:var(--tint-pink)}
.sum b{display:block;font-size:28px;font-weight:300;font-variant-numeric:tabular-nums;letter-spacing:-.2px;line-height:1.1}
.sum span{display:flex;align-items:center;gap:5px;font-size:var(--fs-micro);color:var(--ts);margin-top:4px;white-space:nowrap}
.sum i{width:7px;height:7px;border-radius:50%;flex:none}
.pills{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:15px var(--gutter) 2px}
.pills::-webkit-scrollbar{display:none}
.pills button{flex:none;height:36px;padding:0 15px;border-radius:var(--r-pill);font-size:var(--fs-label);color:var(--tp);background:var(--s2);box-shadow:var(--ring);transition:background .2s,color .2s}
.pills button.on{background:var(--pink);color:var(--on-pink);box-shadow:none}
.rq{display:flex;flex-direction:column;gap:10px;padding:15px var(--gutter) 0}
.rc{display:block;width:100%;text-align:left;border-radius:var(--r-lg);padding:15px;background:var(--s2);box-shadow:var(--ring);transition:transform .15s,box-shadow .3s,background .2s}
.rc:active{transform:scale(.985);background:var(--s3)}
.rc.new{animation:newcard 1.4s var(--e-out)}
@keyframes newcard{0%{box-shadow:inset 0 0 0 2px var(--pink),var(--glow);transform:translateY(-6px)}100%{box-shadow:var(--ring)}}
.rc .r1{display:flex;align-items:center;gap:12px}
.rc .nm{flex:1;min-width:0}
.rc .nm b{display:block;font-size:var(--fs-body-sm);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc .nm small{display:block;font-size:var(--fs-label);color:var(--ts);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.rc .id{font-size:var(--fs-micro);color:var(--ts);font-variant-numeric:tabular-nums;align-self:flex-start;margin-top:3px}
.segbar{display:flex;gap:4px;margin:13px 0 11px}
.segbar i{flex:1;height:4px;border-radius:4px;background:var(--s3);position:relative;overflow:hidden}
.segbar i.d{background:var(--pink)}
.segbar i.c{background:var(--s3)}
.segbar i.c::after{content:'';position:absolute;inset:0;background:var(--ts);animation:seg 1.6s ease-in-out infinite alternate}
.segbar i.c.team::after{background:var(--orange)}
@keyframes seg{from{opacity:.35}to{opacity:1}}
.segbar i.x{background:var(--bad)}
.rc .r3{display:flex;align-items:center;gap:8px}
.rc .r3 .nx{flex:1;min-width:0;font-size:var(--fs-label);color:var(--ts);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc .r3 time{font-size:var(--fs-micro);color:var(--ts)}

.act{margin:0 var(--gutter);border-radius:var(--r-lg);padding:20px;position:relative;overflow:hidden;background:var(--s2);box-shadow:var(--ring)}
.act.team{background:var(--tint-orange);box-shadow:inset 0 0 0 1px rgba(245,130,31,.3)}
.act .ah{display:flex;align-items:center;gap:6px;font-size:var(--fs-micro);font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--ts)}
.act.team .ah{color:var(--orange-tx)}
.act .ah .ms{font-size:18px}
.act h2{font-size:var(--fs-h2);font-weight:600;margin:8px 0 5px;letter-spacing:0;line-height:1.2}
.act p{font-size:var(--fs-label);font-weight:300;color:var(--ts);line-height:1.5}
.act .row2{margin-top:15px}
.docprev{display:flex;gap:12px;align-items:center;margin-top:15px;padding:10px;border-radius:var(--r-md);background:var(--s1);box-shadow:var(--ring)}
.docprev .th{width:64px;height:46px;border-radius:8px;overflow:hidden;flex:none;background:var(--s3)}
.docprev .th img,.docprev .th svg{width:100%;height:100%;object-fit:cover;display:block}
.docprev .dm{flex:1;min-width:0;font-size:var(--fs-label)}
.docprev .dm b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.docprev .dm small{color:var(--ts);font-size:var(--fs-micro)}
.docs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 var(--gutter)}
.docs figure{border-radius:var(--r-md);overflow:hidden;background:var(--s2);box-shadow:var(--ring)}
.docs figure .th{aspect-ratio:4/3;max-width:100%}
.docs figure .th img,.docs figure .th svg{width:100%;height:100%;object-fit:cover;display:block}
.docs figcaption{font-size:var(--fs-micro);padding:6px 8px;color:var(--ts);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.log{list-style:none;padding:0 var(--gutter);display:flex;flex-direction:column;gap:12px}
.log li{display:flex;gap:10px;font-size:var(--fs-label);line-height:1.45}
.log li .ms{font-size:18px;color:var(--ts)}
.log li time{margin-left:auto;color:var(--ts);font-size:var(--fs-micro);white-space:nowrap;padding-left:6px}
.inbox{display:flex;flex-direction:column;gap:10px;padding:10px var(--gutter) 0}
.irow{display:flex;gap:12px;align-items:center;padding:10px;border-radius:var(--r-md);text-align:left;width:100%;background:var(--s2);transition:background .2s}
.irow:active{background:var(--s3)}
.irow .nm{flex:1;min-width:0}
.irow .nm b{display:block;font-size:var(--fs-body-sm);font-weight:500}
.irow .nm small{display:block;font-size:var(--fs-label);color:var(--ts);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.irow .rt{display:flex;flex-direction:column;align-items:flex-end;gap:5px;font-size:var(--fs-micro);color:var(--ts)}
.aipill{display:inline-flex;align-items:center;gap:8px;background:var(--s2);box-shadow:var(--ring);font-size:var(--fs-label);padding:9px 15px;border-radius:var(--r-pill);margin:0 var(--gutter)}
.aipill b{font-weight:600}
.gdot{width:8px;height:8px;border-radius:50%;background:var(--grad);animation:blink 1.2s ease-in-out infinite}
@keyframes blink{50%{opacity:.35}}
.stub{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;flex:1;padding:30px;color:var(--ts);font-size:var(--fs-body-sm);line-height:1.45}
.stub .ms{font-size:44px;color:var(--ts)}
.stub b{color:var(--tp);font-size:var(--fs-h2);font-weight:600}

/* builder */
.svl{display:flex;flex-direction:column;gap:10px;padding:15px var(--gutter) 0}
.svr{display:flex;align-items:center;gap:12px;padding:12px 15px 12px 12px;border-radius:var(--r-lg);background:var(--s2);box-shadow:var(--ring);text-align:left;width:100%}
.ibx{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--s3);flex:none;color:var(--tp)}
.ibx .ms{font-size:22px}
.svr .nm{flex:1;min-width:0;min-height:44px;display:flex;flex-direction:column;justify-content:center}
.svr .nm b{display:block;font-size:var(--fs-body-sm);font-weight:500}
.svr .nm small{display:block;font-size:var(--fs-label);color:var(--ts);margin-top:1px}
.tgl{width:50px;height:30px;border-radius:var(--r-pill);background:var(--s3);box-shadow:inset 0 0 0 1px var(--b2);position:relative;flex:none;transition:background .2s}
.tgl::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s var(--e-out)}
.tgl.on{background:var(--pink);box-shadow:none}
.tgl.on::after{transform:translateX(20px)}
.info{display:flex;gap:10px;margin:0 var(--gutter);padding:12px 15px;border-radius:var(--r-md);background:var(--s2);box-shadow:var(--ring);color:var(--ts);font-size:var(--fs-label);line-height:1.45}
.info .ms{font-size:18px;color:var(--ts)}
.fields{display:flex;flex-wrap:wrap;gap:8px;padding:0 var(--gutter)}
.fields button{font-size:var(--fs-label);min-height:36px;display:inline-flex;align-items:center;gap:4px;padding:6px 14px;border-radius:var(--r-pill);background:var(--s2);box-shadow:var(--ring);color:var(--tp);text-align:left;transition:background .2s}
.fields button:active{background:var(--s3)}
.fields .addq{background:none;box-shadow:none;border:1.5px dashed var(--b3);color:var(--ts)}
.fields .addq .ms{font-size:18px}
.pcard{display:block;width:100%;text-align:left;padding:5px 20px 15px;transition:background .2s}
.pcard:active{background:var(--s3)}
.prow{display:flex;align-items:center;gap:15px;padding:13px 0;border-bottom:1px solid var(--b2)}
.prow>span:first-child{flex:1;min-width:0}
.prow b{display:block;font-size:var(--fs-body-sm);font-weight:500}
.prow small{display:block;font-size:var(--fs-micro);font-weight:300;color:var(--ts);margin-top:2px;line-height:1.4}
.prow .pv2{font-size:var(--fs-body-sm);font-variant-numeric:tabular-nums;white-space:nowrap}
.pedit{display:flex;align-items:center;gap:6px;margin-top:13px;font-size:var(--fs-label);color:var(--pink-tx)}
.pedit .ms{font-size:18px}
.icons{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.icons button{height:44px;border-radius:var(--r-md);background:var(--s2);box-shadow:var(--ring);display:grid;place-items:center;transition:background .2s,color .2s}
.icons button.on{background:var(--pink);color:var(--on-pink);box-shadow:none}
.qsum{display:grid;grid-template-columns:1fr auto;gap:8px 15px;padding:15px;border-radius:var(--r-md);background:var(--s2);box-shadow:var(--ring);font-size:var(--fs-label);margin-bottom:20px}
.qsum span{color:var(--ts)}
.qsum b{font-weight:500;font-variant-numeric:tabular-nums;text-align:right}
.fld input[readonly]{color:var(--ts)}
.bsl{list-style:none;display:flex;flex-direction:column;gap:10px;padding:0 var(--gutter)}
.bs-row{display:flex;align-items:center;gap:10px;padding:8px 12px 8px 4px;border-radius:var(--r-lg);background:var(--s2);box-shadow:var(--ring);transition:transform .2s var(--e-out),box-shadow .2s;position:relative;touch-action:none}
.bs-row.dragging{transition:none;z-index:5;background:var(--elev);box-shadow:var(--shadow-pop),inset 0 0 0 1.5px var(--pink)}
.bs-row.fresh{animation:grow .5s var(--e-push)}
@keyframes grow{from{opacity:0;transform:scale(.92)}}
.handle{width:32px;height:44px;display:grid;place-items:center;color:var(--ts);cursor:grab;flex:none;border-radius:var(--r-md)}
.bs-row .ibx{width:38px;height:38px}
.bs-row .ibx .ms{font-size:19px}
.bs-row .nm{flex:1;min-width:0;text-align:left;min-height:44px;display:flex;flex-direction:column;justify-content:center}
.bs-row .nm b{display:block;font-size:var(--fs-body-sm);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bs-row .nm small{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.bs-row .num{font-size:var(--fs-micro);color:var(--ts);width:14px;text-align:center;font-variant-numeric:tabular-nums}
.addstep{display:flex;align-items:center;justify-content:center;gap:6px;margin:10px var(--gutter) 0;height:50px;border-radius:var(--r-pill);border:1.5px dashed var(--b3);font-size:var(--fs-body-sm);color:var(--tp);width:calc(100% - 30px)}
.kinds{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kinds button{text-align:left;padding:15px;border-radius:var(--r-lg);background:var(--s2);box-shadow:var(--ring);display:flex;flex-direction:column;gap:8px;transition:background .2s}
.kinds button:active{background:var(--s3)}
.kinds button b{font-size:var(--fs-body-sm);font-weight:500}
.kinds button small{font-size:var(--fs-micro);color:var(--ts);line-height:1.45}
.fld{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
.fld label{font-size:var(--fs-label);color:var(--ts)}
.fld input,.fld textarea{height:50px;border-radius:var(--r-md);border:none;background:var(--s2);box-shadow:var(--ring);padding:0 15px;font-size:var(--fs-body);outline:none;transition:box-shadow .2s}
.fld textarea{height:80px;padding:12px 15px;resize:none}
.fld input::placeholder,.fld textarea::placeholder{color:var(--tt)}
.fld input:focus,.fld textarea:focus{box-shadow:inset 0 0 0 1.5px var(--pink)}
.opts{display:flex;flex-wrap:wrap;gap:10px}
.opts button{height:40px;padding:0 16px;border-radius:var(--r-pill);font-size:var(--fs-body-sm);background:var(--s2);box-shadow:var(--ring);transition:background .2s,color .2s,box-shadow .2s,transform .15s}
.opts button:active{transform:scale(.96)}
.opts button.on{background:var(--pink);color:var(--on-pink);box-shadow:none}
.opts button[disabled]{opacity:.38;pointer-events:none}
.fld .hint{font-size:var(--fs-micro);color:var(--ts);line-height:1.45}
.money{display:flex;align-items:center;gap:10px}
.money span{font-size:var(--fs-label);color:var(--ts)}
.money input{flex:1;font-variant-numeric:tabular-nums}

/* ---------- Client app (Rodood system, ANFAL as tenant) ---------- */
.hello{flex:1;min-width:0}
.hello small{display:block;font-size:var(--fs-label);color:var(--ts)}
.hello b{display:block;font-size:var(--fs-h1);font-weight:600;line-height:1.2;letter-spacing:0}
.hero{margin:0 var(--gutter);border-radius:var(--r-lg);padding:20px;background:var(--s2);position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;border-radius:var(--r-lg);padding:1.5px;background:var(--grad);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.hero .top3{display:flex;align-items:center;gap:15px;position:relative}
.ring{width:64px;height:64px;flex:none;position:relative}
.ring svg{width:64px;height:64px;transform:rotate(-90deg)}
.ring circle{fill:none}
.ring .bg{stroke:var(--s3)}
.ring .fg{stroke:var(--pink);stroke-linecap:round;transition:stroke-dashoffset 1s var(--e-out)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:var(--fs-label);font-weight:500;font-variant-numeric:tabular-nums}
.hero .ht{flex:1;min-width:0}
.hero .ht small{display:block;font-size:var(--fs-micro);font-weight:500;color:var(--ts);letter-spacing:.08em;text-transform:uppercase;font-variant-numeric:tabular-nums}
.hero .ht b{display:block;font-size:var(--fs-body-lg);font-weight:600;margin-top:3px;line-height:1.25}
.hero .ht span{display:block;font-size:var(--fs-label);font-weight:300;color:var(--ts);margin-top:2px}
.hero .next{display:flex;align-items:center;gap:10px;margin-top:20px;height:60px;padding:8px 8px 8px 20px;border-radius:var(--r-pill);background:var(--s1);box-shadow:inset 0 0 0 1px var(--b2);width:100%;text-align:left;color:inherit;position:relative;transition:background .2s}
.hero .next:active{background:var(--s3)}
.hero .next div{flex:1;min-width:0;line-height:1.3}
.hero .next div b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:var(--fs-body-sm);font-weight:500;line-height:1.3}
.hero .next div span{font-size:var(--fs-micro);color:var(--ts)}
.hero .next div span.turn{color:var(--orange-tx)}
.hero .go{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--pink);color:var(--on-pink);flex:none;box-shadow:var(--glow);transition:transform .2s var(--e-push)}
.hero .go .ms{font-size:22px}
.hero .next:hover .go{transform:translateX(2px)}
.hero .next:active .go{transform:scale(.92)}
.hero.wait .next{height:auto;min-height:60px;padding:10px 15px}
.dots{display:inline-flex;gap:3px;margin-left:6px;vertical-align:middle}
.dots i{width:4px;height:4px;border-radius:50%;background:currentColor;animation:dot 1.2s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-2px)}}
.heros{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:0 var(--gutter)}
.heros::-webkit-scrollbar{display:none}
.heros .hero{margin:0;flex:0 0 100%;scroll-snap-align:center}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 var(--gutter)}
.sv{text-align:left;padding:15px;border-radius:var(--r-lg);background:var(--s2);box-shadow:var(--ring);display:flex;flex-direction:column;gap:12px;min-height:124px;transition:transform .15s,background .2s}
.sv:active{transform:scale(.97);background:var(--s3)}
.sv .ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--s3)}
.sv b{font-size:var(--fs-body-sm);font-weight:500;line-height:1.3}
.sv small{font-size:var(--fs-micro);color:var(--ts);margin-top:-8px}
.pw{display:flex;align-items:center;justify-content:center;gap:6px;font-size:var(--fs-micro);color:var(--ts);padding:30px 0 5px}
.pw img{width:16px;height:16px}
.shero{margin:0 var(--gutter);padding:20px;border-radius:var(--r-lg);background:var(--s2);box-shadow:var(--ring)}
.shero .ic{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--s3);margin-bottom:15px;position:relative}
.shero .ic .ms{font-size:28px}
.shero h2{font-size:var(--fs-h1);font-weight:600;line-height:1.2;text-wrap:balance;letter-spacing:0}
.shero p{font-size:var(--fs-body-sm);font-weight:300;color:var(--ts);line-height:1.5;margin-top:8px}
.facts{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}
.facts span{display:inline-flex;align-items:center;gap:6px;height:32px;font-size:var(--fs-label);padding:0 12px;border-radius:var(--r-pill);background:var(--s1);box-shadow:inset 0 0 0 1px var(--b2);color:var(--ts)}
.facts .ms{font-size:16px}
.note{display:flex;gap:10px;margin:15px var(--gutter) 0;padding:15px;border-radius:var(--r-md);background:var(--s2);box-shadow:var(--ring);font-size:var(--fs-label);font-weight:300;line-height:1.5;color:var(--ts)}
.note b{color:var(--tp);font-weight:500}
.note .ms{font-size:20px;color:var(--ts)}
.note.warn{background:var(--tint-orange);box-shadow:none;color:var(--tp)}
.note.warn .ms{color:var(--orange-tx)}
.sticky{position:sticky;bottom:0;padding:15px var(--gutter) 20px;background:linear-gradient(to top,var(--canvas) 70%,transparent);margin-top:auto}
.rqhead{margin:0 var(--gutter);display:flex;align-items:center;gap:15px}
.rqhead .ring{width:56px;height:56px}
.rqhead .ring svg{width:56px;height:56px}
.rqhead h2{font-size:var(--fs-h1);font-weight:600;line-height:1.2;letter-spacing:0}
.rqhead small{display:block;font-size:var(--fs-label);color:var(--ts);margin-top:3px}
.nextc{margin:20px var(--gutter) 0;padding:20px;border-radius:var(--r-lg);background:var(--tint-orange);box-shadow:inset 0 0 0 1px rgba(245,130,31,.3);position:relative;overflow:hidden}
.nextc.wait{background:var(--s2);box-shadow:var(--ring)}
.nextc .lbl{display:flex;align-items:center;gap:6px;font-size:var(--fs-micro);font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--orange-tx)}
.nextc.wait .lbl{color:var(--ts)}
.nextc .lbl .ms{font-size:18px}
.nextc h3{font-size:var(--fs-h2);font-weight:600;margin:8px 0 5px;line-height:1.2;letter-spacing:0}
.nextc p{font-size:var(--fs-label);font-weight:300;color:var(--ts);line-height:1.5}
.nextc .btn{margin-top:20px}
.demo{display:inline-flex;align-items:center;gap:6px;margin-top:15px;height:36px;padding:0 14px;font-size:var(--fs-label);color:var(--tp);border-radius:var(--r-pill);background:var(--s1);box-shadow:inset 0 0 0 1px var(--b2)}
.demo .ms{font-size:16px;color:var(--ts)}
.donec{margin:20px var(--gutter) 0;padding:30px 20px;border-radius:var(--r-lg);background:var(--s2);box-shadow:var(--ring);text-align:center;position:relative;overflow:hidden}
.burst{width:80px;height:80px;margin:0 auto 15px;border-radius:50%;background:var(--grad);display:grid;place-items:center;position:relative;color:#fff;box-shadow:var(--glow)}
.burst .ms{font-size:40px}
.burst::before,.burst::after{content:'';position:absolute;inset:0;border-radius:50%;border:2px solid var(--pink);animation:burst 2.2s var(--e-out) infinite}
.burst::after{animation-delay:.7s}
@keyframes burst{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.8);opacity:0}}
.donec h3{font-size:var(--fs-h2);font-weight:600;letter-spacing:0}
.donec p{font-size:var(--fs-label);color:var(--ts);margin-top:6px;line-height:1.45}
.pv{list-style:none;display:flex;flex-direction:column}
.pv-it{display:grid;grid-template-rows:1fr;transition:grid-template-rows .35s var(--e-out),opacity .3s}
.pv-it>div{overflow:hidden}
.pv-it.off{grid-template-rows:0fr;opacity:0}
.pv-row{display:flex;align-items:center;gap:12px;padding:6px 0;font-size:var(--fs-body-sm)}
.pv-row>.ms{font-size:19px;width:38px;height:38px;border-radius:50%;background:var(--s3);display:grid;place-items:center;flex:none}
.pv-row.newin{animation:rise .4s var(--e-push)}
.quote{margin:0 var(--gutter);padding:20px;border-radius:var(--r-lg);background:var(--s2);box-shadow:var(--ring)}
.qline{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;padding:15px 0;border-bottom:1px solid var(--b2);font-size:var(--fs-body-sm)}
.qline:first-child{padding-top:0}
.qline small{display:block;font-size:var(--fs-micro);color:var(--ts);margin-top:3px;max-width:24ch;line-height:1.45}
.qline b{font-variant-numeric:tabular-nums;font-weight:500;white-space:nowrap}
.qtotal{display:flex;justify-content:space-between;align-items:baseline;padding-top:15px;font-size:var(--fs-body-sm)}
.qtotal b{font-size:28px;font-weight:300;font-variant-numeric:tabular-nums;letter-spacing:-.2px}
.upz{margin:0 var(--gutter);border-radius:var(--r-lg);border:1.5px dashed var(--b3);background:var(--s1);padding:30px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;transition:background .2s,border-color .2s}
.upz:hover{background:var(--s2);border-color:var(--pink)}
.upz .ic{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--tint-pink);color:var(--pink-tx);margin-bottom:5px;animation:float 2.4s ease-in-out infinite}
.upz .ic .ms{font-size:28px}
@keyframes float{50%{transform:translateY(-4px)}}
.upz b{font-size:var(--fs-body);font-weight:500}
.upz small{font-size:var(--fs-label);color:var(--ts)}
.linkb{display:flex;align-items:center;justify-content:center;height:44px;margin:5px auto 0;padding:0 15px;font-size:var(--fs-body-sm);color:var(--pink-tx)}
.fcard{margin:0 var(--gutter);padding:15px;border-radius:var(--r-lg);background:var(--s2);box-shadow:var(--ring);position:relative;overflow:hidden}
.fcard .fr{display:flex;gap:15px;align-items:center}
.fcard .th{width:76px;height:56px;border-radius:var(--r-md);overflow:hidden;flex:none;position:relative;background:var(--s3)}
.fcard .th img,.fcard .th svg{width:100%;height:100%;object-fit:cover;display:block}
.fcard .th .scan{position:absolute;left:0;right:0;height:18px;top:-18px;background:linear-gradient(to bottom,transparent,rgba(224,50,140,.7),transparent);opacity:0}
.fcard.scanning .th .scan{opacity:1;animation:scan .9s ease-in-out infinite}
@keyframes scan{to{top:56px}}
.fcard .fm{flex:1;min-width:0}
.fcard .fm b{display:block;font-size:var(--fs-body-sm);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fcard .fm small{display:block;font-size:var(--fs-label);color:var(--ts);margin-top:3px}
.bar{height:5px;border-radius:5px;background:var(--s3);margin-top:15px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--pink);border-radius:5px;transition:width 1.3s cubic-bezier(.4,.1,.2,1)}
.okline{display:flex;align-items:center;gap:6px;font-size:var(--fs-label);color:var(--pink-tx);margin-top:15px;opacity:0;transform:translateY(4px);transition:opacity .3s,transform .3s var(--e-push)}
.okline .ms{font-size:20px}
.fcard.ok .okline{opacity:1;transform:none}
.fcard.ok .bar{display:none}
.letter{margin:0 var(--gutter);padding:20px 18px 15px;border-radius:var(--r-lg);background:var(--paper);color:var(--paper-tx);box-shadow:var(--shadow-float);font-size:var(--fs-label);line-height:1.6;position:relative}
.letter h4{font-size:var(--fs-body-sm);font-weight:600;margin-bottom:8px}
.letter .lh{display:flex;justify-content:space-between;font-size:var(--fs-micro);color:var(--paper-ts);margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--paper-line)}
.letter mark{background:rgba(224,50,140,.12);color:inherit;padding:0 3px;border-radius:4px}
.sigbox{position:relative;margin-top:15px;height:120px;border-radius:var(--r-md);background:rgba(10,11,42,.03);box-shadow:inset 0 0 0 1px var(--paper-line)}
.sigbox canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.sigbox .base{position:absolute;left:15px;right:15px;bottom:30px;border-bottom:1px dashed rgba(10,11,42,.3);pointer-events:none}
.sigbox .ph{position:absolute;left:15px;bottom:9px;font-size:var(--fs-micro);color:var(--paper-ts);pointer-events:none;transition:opacity .2s}
.sigbox.inked .ph{opacity:0}
.sigbox .clr{position:absolute;top:6px;right:6px;height:32px;padding:0 12px;font-size:var(--fs-micro);font-weight:500;color:var(--paper-tx);border-radius:var(--r-pill);background:rgba(10,11,42,.06)}
.stamp{position:absolute;right:20px;bottom:36px;padding:7px 12px;border:2px solid var(--pink);color:#C21873;border-radius:var(--r-pill);font-size:var(--fs-micro);font-weight:600;letter-spacing:var(--ls-ui);text-transform:uppercase;transform:rotate(-8deg) scale(1.8);opacity:0;pointer-events:none;background:rgba(255,255,255,.9)}
.stamp.on{animation:stamp .5s var(--e-push) forwards}
@keyframes stamp{to{opacity:1;transform:rotate(-8deg) scale(1)}}
.chk{display:flex;gap:12px;align-items:center;margin:15px var(--gutter) 0;min-height:44px;font-size:var(--fs-label);line-height:1.45;color:var(--ts);cursor:pointer}
.chk input{appearance:none;width:24px;height:24px;border-radius:8px;box-shadow:inset 0 0 0 1.5px var(--b3);flex:none;display:grid;place-items:center;transition:background .2s;cursor:pointer}
.chk input:checked{background:var(--pink);box-shadow:none}
.chk input:checked::after{content:'';width:10px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.updates{list-style:none;padding:0 var(--gutter);display:flex;flex-direction:column;gap:10px}
.updates li{display:flex;gap:12px;padding:15px;border-radius:var(--r-lg);background:var(--s2);box-shadow:var(--ring);font-size:var(--fs-body-sm);line-height:1.45}
.updates li>.ms{font-size:20px;width:40px;height:40px;border-radius:50%;background:var(--s3);display:grid;place-items:center;flex:none}
.updates li b{font-weight:300}
.updates li time{display:block;font-size:var(--fs-micro);color:var(--ts);margin-top:3px}
.updates li.unread{box-shadow:inset 0 0 0 1px rgba(245,130,31,.4)}
.updates li.unread>.ms{background:var(--tint-orange);color:var(--orange-tx)}
.lrow{display:flex;align-items:center;gap:12px;padding:12px 15px 12px 12px;border-radius:var(--r-lg);background:var(--s2);box-shadow:var(--ring);width:100%;text-align:left;transition:background .2s}
.lrow:active{background:var(--s3)}
.lrow .sv-ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--s3);flex:none}
.lrow .nm{flex:1;min-width:0}
.lrow .nm b{display:block;font-size:var(--fs-body-sm);font-weight:500}
.lrow .nm small{display:block;font-size:var(--fs-label);color:var(--ts);margin-top:2px}
.lrow>.ms{color:var(--ts)}
.list{display:flex;flex-direction:column;gap:10px;padding:0 var(--gutter)}
.mini{height:4px;border-radius:4px;background:var(--s3);overflow:hidden;margin-top:8px}
.mini i{display:block;height:100%;background:var(--pink);border-radius:4px;transition:width .8s var(--e-out)}
.acct{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px var(--gutter) 5px;text-align:center}
.acct .big{width:72px;height:72px;border-radius:50%;background:var(--s3);display:grid;place-items:center;font-size:var(--fs-h2);font-weight:500;margin-bottom:5px}
.acct b{font-size:var(--fs-h2);font-weight:600}
.acct small{font-size:var(--fs-label);color:var(--ts)}

/* web link chrome */
.chrome{display:flex;align-items:center;gap:8px;padding:2px 12px 10px;flex:none}
.chrome .url{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;height:38px;border-radius:var(--r-md);background:var(--s2);box-shadow:var(--ring);font-size:var(--fs-label);color:var(--ts);min-width:0}
.chrome .url .ms{font-size:15px}
.chrome .url span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chrome button{font-size:var(--fs-body-sm);color:var(--pink-tx);height:44px;padding:0 6px}
.chrome>.ms{color:var(--ts);width:44px;text-align:center}

/* ---------- WhatsApp (the real WhatsApp, not Rodood chrome) ---------- */
.vp.wa-mode .sbar{color:var(--w-tp)}
.wa{background:var(--w-bg) !important;color:var(--w-tp);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;letter-spacing:0}
.wa .whd{display:flex;align-items:center;gap:10px;padding:4px 12px 10px;background:var(--w-head);box-shadow:0 1px 0 rgba(0,0,0,.08);flex:none}
.wa .whd b{display:flex;align-items:center;gap:4px;font-size:16px;font-weight:600}
.wa .whd b .ms{font-size:16px;color:var(--w-accent)}
.wa .whd small{display:block;font-size:12px;color:var(--w-ts)}
.wa .tav{background:#2A3942;color:#E9EDEF}
.wa .wscroll{flex:1;overflow-y:auto;scrollbar-width:none;padding:12px 10px 10px;display:flex;flex-direction:column;gap:6px}
.wa .wscroll::-webkit-scrollbar{display:none}
.wday{align-self:center;font-size:12px;padding:4px 10px;border-radius:8px;background:var(--w-head);color:var(--w-ts);margin:2px 0 4px}
.bub{max-width:84%;padding:7px 9px 5px;border-radius:10px;font-size:15px;line-height:1.38;position:relative;box-shadow:0 1px .5px rgba(0,0,0,.13);animation:bub .32s var(--e-push);white-space:pre-line}
@keyframes bub{from{opacity:0;transform:translateY(8px) scale(.96)}}
.bub.in{align-self:flex-start;background:var(--w-in);border-top-left-radius:3px}
.bub.out{align-self:flex-end;background:var(--w-out);border-top-right-radius:3px}
.bub time{display:block;text-align:right;font-size:11px;color:var(--w-ts);margin-top:2px}
.bub .from{display:block;font-size:12px;font-weight:600;color:var(--w-accent);margin-bottom:2px}
.wbtns{display:flex;flex-direction:column;gap:5px;align-self:flex-start;width:84%;animation:bub .32s var(--e-push)}
.wbtns button{background:var(--w-in);color:var(--w-accent);font-size:14px;font-weight:500;min-height:44px;padding:8px;border-radius:10px;box-shadow:0 1px .5px rgba(0,0,0,.13);display:flex;align-items:center;justify-content:center;gap:6px}
.wbtns button[disabled]{opacity:.55}
.wbtns.grid{display:grid;grid-template-columns:1fr 1fr}
.wbtns.grid button{font-size:13px;padding:6px}
.lnk{display:block;margin:-2px -4px 4px;border-radius:8px;overflow:hidden;background:color-mix(in srgb,var(--w-tp) 7%,transparent);text-align:left;width:calc(100% + 8px)}
.lnk .lt{display:flex;gap:10px;align-items:center;padding:10px}
.lnk .lt img{width:40px;height:40px;border-radius:10px}
.lnk .lt b{display:block;font-size:14px;font-weight:600}
.lnk .lt small{display:block;font-size:12px;color:var(--w-ts);margin-top:1px}
.lnk u{display:block;font-size:12px;color:#53BDEB;padding:0 10px 8px;text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wimg{display:block;width:190px;height:132px;border-radius:7px;overflow:hidden;margin:-3px -5px 3px}
.wimg svg{width:100%;height:100%;display:block}
.typing{align-self:flex-start;background:var(--w-in);padding:10px 12px;border-radius:10px;border-top-left-radius:3px;color:var(--w-ts);animation:bub .25s var(--e-out)}
.wbar{display:flex;align-items:center;gap:8px;padding:8px 10px 24px;background:var(--w-bar);flex:none}
.wbar .wi{flex:1;display:flex;align-items:center;gap:6px;height:44px;border-radius:22px;background:var(--w-in);padding:0 6px 0 14px;min-width:0}
.wbar .wi input{flex:1;border:none;background:none;outline:none;font-size:15px;min-width:0;color:var(--w-tp)}
.wbar .wi button{width:36px;height:36px;color:var(--w-ts);display:grid;place-items:center}
.wbar .wi button[disabled]{opacity:.35}
.wbar .send{width:44px;height:44px;border-radius:50%;background:var(--w-accent);color:#fff;display:grid;place-items:center;flex:none}

/* ---------- Spec notes ---------- */
.spec{max-width:1000px;margin:0 auto;padding-block:10px 60px;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
.spec section{background:var(--s2);box-shadow:var(--ring);border-radius:var(--r-lg);padding:24px;min-width:0}
.spec h2{font-size:var(--fs-h2);font-weight:600;margin-bottom:15px;text-wrap:balance;letter-spacing:0}
.spec p,.spec li{font-size:var(--fs-label);color:var(--ts);line-height:1.6}
.spec ul{padding-left:18px;display:flex;flex-direction:column;gap:6px}
.spec .tw{overflow-x:auto}
.spec table{width:100%;border-collapse:collapse;font-size:var(--fs-label)}
.spec th{text-align:left;font-weight:400;color:var(--ts);padding:6px 8px 6px 0;border-bottom:1px solid var(--b2);white-space:nowrap;text-transform:uppercase;font-size:var(--fs-micro);letter-spacing:var(--ls-ui)}
.spec td{padding:8px 8px 8px 0;border-bottom:1px solid var(--b2);vertical-align:top;color:var(--ts)}
.spec td:first-child{color:var(--tp);white-space:nowrap}
.spec code{font-size:var(--fs-micro);background:var(--s3);padding:2px 6px;border-radius:6px;white-space:nowrap}
.kindlist{display:grid;gap:12px}
.kindlist div{display:flex;gap:12px;align-items:flex-start;font-size:var(--fs-label);color:var(--ts);line-height:1.45}
.kindlist .ibx{width:38px;height:38px}
.kindlist .ibx .ms{font-size:19px}
.kindlist b{color:var(--tp);font-weight:500;display:block}

@media (max-width:979px){
  .rail{display:none}
  .viewseg{display:flex}
  .dev[data-hide="1"]{display:none}
}
@media (max-width:420px){
  body{padding-inline:8px}
  .phone{border-width:6px;border-radius:40px}
  .vp{height:720px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:1ms !important;animation-iteration-count:1 !important;transition-duration:1ms !important;animation-delay:0ms !important}
}

/* ---------- Multi-business ---------- */
.bizbtn{display:flex;align-items:center;gap:8px;height:44px;padding:0 10px 0 0;border-radius:var(--r-pill);flex:none;max-width:70%;transition:background .2s}
.bizbtn:active{background:var(--s2)}
.bizbtn .bn{font-size:var(--fs-h2);font-weight:600;letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bizbtn>.ms{font-size:20px;color:var(--ts)}
.bizbtn.sm{padding:0 6px 0 0;background:var(--s2);box-shadow:var(--ring)}
.bizbtn.sm .tav{width:44px;height:44px}
.onb{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;margin:15px var(--gutter) 0;padding:24px 20px;border-radius:var(--r-lg);background:var(--s2);box-shadow:var(--ring);color:var(--ts);font-size:var(--fs-label);font-weight:300;line-height:1.5}
.onb>.ms{font-size:28px;color:var(--tp);width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--s3);margin-bottom:4px}
.onb b{font-size:var(--fs-body);font-weight:600;color:var(--tp)}
.onb.big{position:relative;margin-top:20px;padding:30px 20px}
.onb.big::before{content:'';position:absolute;inset:0;border-radius:var(--r-lg);padding:1.5px;background:var(--grad);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.onb.big .btn{margin-top:12px}
.tplrow{display:flex;align-items:center;gap:12px;width:100%;padding:12px 15px 12px 12px;border-radius:var(--r-lg);background:var(--s2);box-shadow:var(--ring);text-align:left;transition:background .2s}
.tplrow:active{background:var(--s3)}
.tplrow .nm{flex:1;min-width:0}
.tplrow .nm b{display:block;font-size:var(--fs-body-sm);font-weight:500}
.tplrow .nm small{display:block;font-size:var(--fs-micro);color:var(--ts);margin-top:2px}
.tplrow>.ms{color:var(--ts)}
.tplh{font-size:var(--fs-micro);font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--ts);margin:22px 0 10px}
.tplg+.tplg{margin-top:15px}
.tpli{display:inline-flex;align-items:center;height:24px;padding:0 10px;margin-bottom:8px;border-radius:var(--r-pill);background:var(--s3);font-size:var(--fs-micro);font-weight:500}
.lrow.cur{box-shadow:inset 0 0 0 1.5px var(--pink)}

/* ================= Rodood Business — web dashboard =================
   Layout: 76px icon sidebar + panes (list · detail · context), as in the Rodood web app handoff. */
html,body{height:100%}
body.app{padding:0;overflow:hidden;font-size:14px;letter-spacing:.2px}
.app-shell{display:flex;height:100%;min-height:560px}
.side{width:76px;flex:none;display:flex;flex-direction:column;align-items:center;padding:20px 0 16px;box-shadow:inset -1px 0 0 var(--b2);gap:6px;background:var(--canvas);z-index:5}
.side .logo{width:32px;height:32px;margin-bottom:16px}
.nav{width:58px;min-height:54px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ts);font-size:10.5px;font-weight:500;position:relative;transition:background .2s,color .2s;letter-spacing:0}
.nav .ms{font-size:22px;transition:transform .25s var(--e-push)}
.nav:hover{background:var(--s2);color:var(--tp)}
.nav.on{background:var(--tint-pink);color:var(--pink-tx)}
.nav.on .ms{font-variation-settings:'FILL' 1,'wght' 500,'GRAD' 0,'opsz' 24;transform:scale(1.06)}
.nav .bdg{position:absolute;top:3px;right:5px;min-width:18px;height:18px;padding:0 5px;border-radius:var(--r-pill);background:var(--orange);color:var(--navy);font-size:11px;font-weight:600;display:grid;place-items:center}
.nav .new{position:absolute;top:4px;right:2px;height:16px;padding:0 5px;border-radius:var(--r-pill);background:var(--grad);color:#fff;font-size:9px;font-weight:600;display:grid;place-items:center;letter-spacing:.04em}
.side .spacer{flex:1}
.bizsw{width:48px;height:48px;border-radius:50%;margin-top:8px;display:grid;place-items:center;position:relative;transition:transform .15s}

let ST;

function applies(s,r){if(!s.cond)return true;const v=r.values[s.cond.f];if(v==null||v==='')return null;return v===s.cond.eq}
function startPhase(kind){return({form:'client',quote:'team',upload:'client',sign:'client',team:'team',gov:'gov'})[kind]}
function curStep(r){return r.steps.find(s=>s.st==='active'||s.st==='rejected')}
function whoOf(r){if(r.status==='done')return'done';const c=curStep(r);if(!c)return'done';if(c.st==='rejected')return'team';return({client:'client',redo:'client',review:'team',team:'team',gov:'gov'})[c.phase]}
function progress(r){const ap=r.steps.filter(s=>applies(s,r)!==false&&s.st!=='skipped');const d=ap.filter(s=>s.st==='done').length;return{d,t:ap.length,p:ap.length?d/ap.length:0}}
function log(r,by,text,ctext){r.log.unshift({t:Date.now(),by,text,ctext})}
function advance(r){
  for(const s of r.steps){
    if(s.st==='done'||s.st==='skipped')continue;
    if(s.st==='rejected')return;
    if(applies(s,r)===false){s.st='skipped';continue}
    if(s.st!=='active'){s.st='active';s.phase=startPhase(s.kind);s.since=Date.now();
      if(s.kind==='upload'&&s.file&&s.phase==='client')s.phase='review';
      if(s.kind==='quote'){const pr=svcById(r.svc).price;if(pr.mode==='fixed'&&!pr.gov){r.quote={gov:0,fee:pr.fixed,vat:pr.vat};s.phase='client';s.auto=true;log(r,'team','Fixed price sent automatically','Your price is ready to accept')}}}

}

function markFresh(r,s){const k=s.id;ST.fresh.add(k);setTimeout(()=>ST.fresh.delete(k),1600)}
/* ---------- Timeline ---------- */
function stepMeta(r,s,view){
  const a=applies(s,r);
  if(s.st==='done')return{cls:'done',sub:(s.at?`${view==='c'?'Done':'Completed'} · ${fmtT(s.at)}`:'Done')};
  if(s.st==='skipped')return{cls:'skip',sub:'Not needed for this request'};
  if(s.st==='rejected')return{cls:'rej',sub:'Rejected by {{auth}} · team reviewing'};
  if(s.st==='active'){
    const w=({client:'client',redo:'client',review:'team',team:'team',gov:'gov'})[s.phase];
    let sub='';
    if(view==='c')sub=({client:'Your turn',redo:'Please send it again',review:'{{biz}} is checking it',team:s.kind==='quote'?'{{biz}} is preparing your quote':'{{biz}} is working on it',gov:'Waiting for {{auth}}'})[s.phase];
    else sub=({client:`Waiting on client · ${ago(s.since)}`,redo:'Asked again · waiting on client',review:'Needs your review',team:s.kind==='quote'?'Prepare quotation':'Your team',gov:'With {{auth}}'})[s.phase];
    return{cls:'cur who-'+w+(s.phase==='redo'?' redo':''),sub};
  }
  if(a===false)return{cls:'skip',sub:'Not needed for this request'};
  if(a===null)return{cls:'cond',sub:condText(s)};
  return{cls:'',sub:view==='c'?({client:'You',team:'{{biz}}',gov:'{{auth}}'})[KIND[s.kind].who]:({client:'Client',team:'Team',gov:'{{auth}}'})[KIND[s.kind].who]};
}
function condText(s){if(!s.cond)return'';return`Only if ${FL[s.cond.f].label.toLowerCase().replace(/\?$/,'')}: ${s.cond.eq}`}
function timeline(r,view){
  return `<ol class="tl">${r.steps.map(s=>{const m=stepMeta(r,s,view);const fresh=ST.fresh.has(s.id)?' fresh':'';
    const icon=s.st==='done'?CHECK:s.st==='rejected'?'<span class="ms">close</span>':s.st==='skipped'?'<span class="ms">remove</span>':`<span class="ms">${KIND[s.kind].icon}</span>`;
    const flag=view==='b'&&s.flag&&s.st==='active'?' <span class="chip w-hu"><span class="ms">flag</span>Needs a person</span>':'';
    return `<li class="tn ${m.cls}${fresh}"><span class="node">${icon}</span><span class="ln"></span><div class="tb"><b>${esc(s.name)}</b><small>${esc(m.sub)}${flag}</small></div></li>`}).join('')}</ol>`;
}

const AVC=['#E0328C','#9B1FE0','#F5821F','#2F9E75','#5B8CFF','#C2410C'];
function avatar(name,ch){const i=name.split(/\s+/).filter(w=>/^[A-Z]/.test(w)).slice(0,2).map(w=>w[0]).join('');

function segbar(r){return `<div class="segbar">${r.steps.filter(s=>s.st!=='skipped'&&applies(s,r)!==false).map(s=>{const w=whoOf(r);return `<i class="${s.st==='done'?'d':s.st==='rejected'?'x':s.st==='active'?'c '+w:''}"></i>`}).join('')}</div>`}
function nextText(r){const w=whoOf(r),c=curStep(r);if(w==='done')return'Completed';

  return({client:`Waiting on client · ${c.name}`,team:c.phase==='review'?`Review ${c.name.toLowerCase()}`:c.kind==='quote'?'Prepare quotation':c.name,gov:`With {{auth}}${r.appNo?' · '+r.appNo:''}`})[w]}

const W={view:'requests',mode:'list',filter:'all',q:'',sel:null,svc:null};

function counts(){const c={team:0,client:0,gov:0,done:0};ST.requests.forEach(r=>c[whoOf(r)]++);return c}
function visibleReqs(){const q=W.q.trim().toLowerCase();return ST.requests.filter(r=>(W.filter==='all'||whoOf(r)===W.filter)&&(!q||[r.id,r.company,svcById(r.svc).name,subj(r)].join(' ').toLowerCase().includes(q))).sort(order)}
function stagger(root){$$('.stg',root).forEach(g=>[...g.children].forEach((c,i)=>c.style.setProperty('--i',Math.min(i,12))))}
function animIn(el){if(!el)return;el.classList.remove('enter');void el.offsetWidth;el.classList.add('enter');stagger(el)}

/* ---------- feedback ---------- */
function toast(text,icon='check_circle'){const el=$('#toast');el.innerHTML=`<span class="ms">${icon}</span>${esc(tk(text))}`;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),2600)}
function pushNote(title,text,req){const el=$('#wpush');el.innerHTML=`<span class="pi"><span class="ms">notifications_active</span></span><span style="min-width:0"><b>${esc(tk(title))}</b><span>${esc(tk(text))}</span></span>`;el.dataset.req=req||'';el.classList.remove('show');void el.offsetWidth;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),4200)}

function rcard(r){const w=whoOf(r),svc=svcById(r.svc),c=curStep(r);const flag=c?.flag||c?.st==='rejected';

function emptyDetail(){const c=counts();return `<div class="empty-pane"><span class="ms">assignment</span><b>Pick a request</b><span>Choose one from the list to see its journey and act on it.</span>

  if(w==='team'&&c.phase==='review')return `<div class="act team"><div class="ah"><span class="ms">visibility</span>Needs your review</div><h2>${esc(c.name)}</h2><p>Check it is clear, valid and matches the request.</p><div class="docprev"><div class="th">${thumb(c.file)}</div><div class="dm"><b>${esc(c.file?.name||'document')}</b><small>${esc(c.file?.size||'')} · ${c.file?.via==='wa'?'sent on WhatsApp':'uploaded by client'}</small></div></div><div class="row2"><button class="btn sm sec2" data-act="askagain" data-id="${r.id}"><span class="ms">undo</span>Ask again</button><button class="btn sm pri" data-act="approve" data-id="${r.id}"><span class="ms">check</span>Approve</button></div></div>`;
  if(w==='team'&&c.kind==='quote')return `<div class="act team"><div class="ah"><span class="ms">request_quote</span>Your turn</div><h2>Prepare the quotation</h2><p>${svc.price.mode==='fixed'?'Your service charge is fixed for this service.':'This service is quoted per request.'}${svc.price.gov?' Add the {{feeShort}} on its own line.':''}</p><div class="row2"><button class="btn sm pri" data-act="quote" data-id="${r.id}">Prepare quotation</button></div></div>`;

  if(w==='client')return `<div class="act"><div class="ah"><span class="ms">hourglass_top</span>Waiting on client · ${ago(c.since)}</div><h2>${esc(c.name)}</h2><p>${c.phase==='redo'?`You asked for it again: ${esc(c.reason)}.`:`${esc(r.contact)} completes this ${r.channel==='wa'?'from the WhatsApp link':'in the Rodood client app'}.`}</p><div class="row2"><button class="btn sm sec2" data-act="remind" data-id="${r.id}"><span class="ms">notifications_active</span>Send reminder</button></div><button class="demo2" data-act="simulate" data-id="${r.id}"><span class="ms">smart_display</span>Simulate client reply<em>Demo</em></button></div>`;

function reqDetail(r){

function refreshSvc(anim){
  sideState();if(W.view!=='services')return;
  if(!ST.services.length||!$('#builder')){render(true);return}
  const s=svcById(W.svc);
  const l=$('#slist');if(l){const sc=l.scrollTop;l.innerHTML=tk(svcItems());l.scrollTop=sc}
  const b=$('#builder');const bsc=$('.pscroll',b)?.scrollTop||0;b.innerHTML=tk(builder(s));if(anim)animIn(b);else{const x=$('.pscroll',b);if(x)x.scrollTop=bsc}
  const p=$('#prev');if(p){const psc=$('#cpv-in')?.scrollTop||0;p.innerHTML=tk(clientPreview(s));if(anim)animIn(p);else{$('#cpv-in').scrollTop=psc;const ph=$('.cpv-phone',p);ph.classList.remove('pulse-once');void ph.offsetWidth;ph.classList.add('pulse-once')}}
  bindDrag();
}
function bindDrag(){
  const list=$('#bsl');if(!list||list._b)return;list._b=1;
  const commit=(from,to)=>{if(from===to)return;const s=svcById(W.svc);const [m]=s.steps.splice(from,1);s.steps.splice(to,0,m);refreshSvc(false);$(`#bsl .handle[data-i="${to}"]`)?.focus({preventScroll:true})};
  list.addEventListener('keydown',e=>{const h=e.target.closest('.handle');if(!h)return;const i=+h.dataset.i;if(e.key==='ArrowUp'&&i>0){e.preventDefault();commit(i,i-1)}if(e.key==='ArrowDown'&&i<list.children.length-1){e.preventDefault();commit(i,i+1)}});
  list.addEventListener('pointerdown',e=>{const h=e.target.closest('.handle');if(!h)return;e.preventDefault();
    const rows=[...list.children],row=h.closest('.bs-row'),idx=rows.indexOf(row);const rects=rows.map(r=>r.getBoundingClientRect());const step=rows.length>1?rects[1].top-rects[0].top:rects[0].height+10;
    const y0=e.clientY;let to=idx;row.classList.add('dragging');h.setPointerCapture(e.pointerId);
    const move=ev=>{const dy=ev.clientY-y0;row.style.transform=`translateY(${dy}px) scale(1.02)`;to=Math.max(0,Math.min(rows.length-1,idx+Math.round(dy/step)));
      rows.forEach((r,i)=>{if(r===row)return;let sh=0;if(idx<to&&i>idx&&i<=to)sh=-step;if(idx>to&&i<idx&&i>=to)sh=step;r.style.transform=sh?`translateY(${sh}px)`:''})};
    const up=()=>{h.removeEventListener('pointermove',move);rows.forEach(r=>r.style.transform='');row.classList.remove('dragging');commit(idx,to)};
    h.addEventListener('pointermove',move);h.addEventListener('pointerup',up,{once:true});h.addEventListener('pointercancel',up,{once:true})});
}
