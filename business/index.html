      W.sel=r.id;W.filter='all';W.q='';W.mode='list';closeModal();render(true);toast('Request created · link sent on WhatsApp','send')})})};

/* service builder actions */
const ICONS=['description','badge','autorenew','swap_horiz','event_busy','work_history','groups','gpp_maybe','id_card','build','account_balance','receipt_long','home_work','flight_takeoff','local_shipping','verified','gavel','storefront','handyman','contract','health_and_safety','school','car_repair','medical_services'];
function createFrom(tpl){const [kind,a,c]=tpl.split(':');const id=uid('svc');let ns;
  if(kind==='copy'){const src=svcById(a);ns={...structuredClone(src),id,name:src.name+' (copy)',on:false,steps:src.steps.map(x=>({...structuredClone(x),id:uid('st')}))}}
  else if(kind==='lib'){const t=TENANTS.find(x=>x.id===a);const d=t.defs().find(x=>x.id===c);ns={...d,id,on:false,price:{...(d.price||PRICE[d.id])}}}
  else ns={id,name:'New service',icon:'description',eta:'Depends on the case',blurb:'Say in one line what this service does for the client.',on:false,fields:['details'],steps:[S('form','Your details'),S('quote','Quotation'),S('team','Team review')],price:{mode:'quote',fixed:0,gov:false,vat:true}};
  ST.services.unshift(ns);W.view='services';W.svc=id;closeModal();render(true);toast(kind==='lib'?'Template added as a draft':'Draft service created','add_circle');setTimeout(()=>A.editdetails({svc:id}),420)}
A.newsvc=()=>modal(`<h3>New service</h3><p class="sub">Start blank, copy one of yours, or pick a ready-made service and change it to fit your business.</p>
  <button class="tplrow" data-act="usetpl" data-tpl="blank"><span class="ibx"><span class="ms">add</span></span><span class="nm"><b>Start blank</b><small>A details form, a quotation and a team step</small></span><span class="ms">chevron_right</span></button>
  ${ST.services.length?`<div class="tplh">Copy one of yours</div><div class="kinds">${ST.services.slice(0,4).map(x=>`<button data-act="usetpl" data-tpl="copy:${x.id}"><span class="ibx"><span class="ms">${x.icon}</span></span><b>${esc(x.name)}</b><small>${x.steps.length} steps · ${esc(priceSummary(x))}</small></button>`).join('')}</div>`:''}
  <div class="tplh">Template library</div>${libraryHtml()}`,null,true);
A.usetpl=d=>createFrom(d.tpl);
A.editdetails=d=>{const s=svcById(d.svc);let icon=s.icon;
  modal(`<h3>Service details</h3><p class="sub">This is what clients see in the service list.</p>
  <div class="fld"><label for="sd-name">Name</label><input id="sd-name" value="${esc(s.name)}"></div>
  <div class="fld"><label for="sd-blurb">Short description</label><textarea id="sd-blurb">${esc(s.blurb)}</textarea></div>
  <div class="fld"><label for="sd-eta">Usual time</label><input id="sd-eta" value="${esc(s.eta)}" placeholder="e.g. Usually 3–5 working days"><div class="hint">Keep it an estimate. The authority decides the timing.</div></div>
  <div class="fld"><label id="sd-il">Icon</label><div class="icons" id="sd-icons" role="radiogroup" aria-labelledby="sd-il" style="grid-template-columns:repeat(8,1fr)">${ICONS.map(i=>`<button role="radio" aria-checked="${i===icon}" class="${i===icon?'on':''}" data-i="${i}" aria-label="${i.replace(/_/g,' ')}"><span class="ms">${i}</span></button>`).join('')}</div></div>
  <button class="btn pri" id="sd-save">Save details</button>`,m=>{
    const live=()=>{s.name=$('#sd-name',m).value.trim()||s.name;s.blurb=$('#sd-blurb',m).value.trim();s.eta=$('#sd-eta',m).value.trim()||s.eta;s.icon=icon;const p=$('#prev');if(p)p.innerHTML=tk(clientPreview(s))};
    m.oninput=live;
    $('#sd-icons',m).addEventListener('click',e=>{const b=e.target.closest('[data-i]');if(!b)return;icon=b.dataset.i;$$('#sd-icons button',m).forEach(x=>{x.classList.toggle('on',x===b);x.setAttribute('aria-checked',x===b)});live()});
    $('#sd-save',m).addEventListener('click',()=>{live();closeModal();toast('Details saved');refreshSvc(false)})})};
A.editprice=d=>{const s=svcById(d.svc);let mode=s.price.mode;
  modal(`<h3>Price</h3><p class="sub">Every quotation for ${esc(s.name)} starts from this.</p>
  <div class="fld"><label id="pr-l">How is it priced?</label><div class="opts" id="pr-mode" role="radiogroup" aria-labelledby="pr-l"><button role="radio" aria-checked="${mode==='fixed'}" data-m="fixed" class="${mode==='fixed'?'on':''}">Fixed price</button><button role="radio" aria-checked="${mode==='quote'}" data-m="quote" class="${mode==='quote'?'on':''}">Quote each request</button></div></div>
  <div class="fld" id="pr-fixed" style="${mode==='fixed'?'':'display:none'}"><label for="pr-amt">Service charge</label><div class="money"><span>BHD</span><input id="pr-amt" inputmode="decimal" value="${Number(s.price.fixed||0).toFixed(3)}"></div><div class="hint">Clients see this before they start. Enter 0 for a free service.</div></div>
  <div class="hint" id="pr-quote" style="margin:-6px 0 18px;${mode==='quote'?'':'display:none'}">Clients see "Priced after review". Your team enters the charge on each request.</div>
  <label class="chk" style="margin:0 0 6px"><input type="checkbox" id="pr-gov" ${s.price.gov?'checked':''}>A {{feeShort}} is added on each quotation</label>
  <label class="chk" style="margin:0 0 18px"><input type="checkbox" id="pr-vat" ${s.price.vat?'checked':''}>Add VAT (10%) to the service charge</label>
  <button class="btn pri" id="pr-save">Save price</button>`,m=>{
    $('#pr-mode',m).addEventListener('click',e=>{const b=e.target.closest('[data-m]');if(!b)return;mode=b.dataset.m;$$('#pr-mode button',m).forEach(x=>{x.classList.toggle('on',x===b);x.setAttribute('aria-checked',x===b)});$('#pr-fixed',m).style.display=mode==='fixed'?'':'none';$('#pr-quote',m).style.display=mode==='quote'?'':'none'});
    $('#pr-save',m).addEventListener('click',()=>{s.price={mode,fixed:Math.max(0,parseFloat($('#pr-amt',m).value)||0),gov:$('#pr-gov',m).checked,vat:$('#pr-vat',m).checked};closeModal();toast('Price saved · new requests use it','payments');refreshSvc(false)})})};
A.addq=d=>qEditor(d.svc,null);
A.editq=d=>qEditor(d.svc,d.f);
function qEditor(svcId,key){const s=svcById(svcId);const F=key?FL[key]:{label:'',type:'choice',opts:['Yes','No']};let type=F.type;const used=key&&s.steps.some(x=>x.cond?.f===key);
  modal(`<h3>${key?'Edit question':'Add a question'}</h3><p class="sub">Choice answers can switch steps on or off.</p>
  <div class="fld"><label for="qe-label">Question</label><input id="qe-label" value="${esc(F.label)}" placeholder="e.g. Is this your first visit?"></div>
  <div class="fld"><label id="qe-tl">Answer type</label><div class="opts" id="qe-type" role="radiogroup" aria-labelledby="qe-tl"><button role="radio" data-t="choice" class="${type==='choice'?'on':''}">Choose one</button><button role="radio" data-t="text" class="${type==='text'?'on':''}">Short answer</button></div></div>
  <div class="fld" id="qe-of" style="${type==='choice'?'':'display:none'}"><label for="qe-opts">Choices</label><input id="qe-opts" value="${esc((F.opts||[]).join(', '))}"><div class="hint">Separate them with commas.</div></div>
  ${used?'<div class="hint" style="margin:-8px 0 18px">A step depends on this answer, so keep its choices the same.</div>':''}
  <div class="row2">${key?`<button class="btn sm sec2 danger" id="qe-del" ${used?'disabled':''}><span class="ms">delete</span>Remove</button>`:''}<button class="btn sm pri" id="qe-save">${key?'Save':'Add question'}</button></div>`,m=>{
    $('#qe-type',m).addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(!b)return;type=b.dataset.t;$$('#qe-type button',m).forEach(x=>x.classList.toggle('on',x===b));$('#qe-of',m).style.display=type==='choice'?'':'none'});
    $('#qe-del',m)?.addEventListener('click',()=>{s.fields=s.fields.filter(f=>f!==key);closeModal();toast('Question removed','delete');refreshSvc(false)});
    $('#qe-save',m).addEventListener('click',()=>{const label=$('#qe-label',m).value.trim();if(!label){$('#qe-label',m).focus();return}
      const opts=$('#qe-opts',m).value.split(',').map(x=>x.trim()).filter(Boolean);const def=type==='choice'?{label,type,opts:opts.length?opts:['Yes','No']}:{label,type,ph:''};
      if(key){const nk=key.startsWith('q')?key:uid('q');FL[nk]=def;if(nk!==key){s.fields=s.fields.map(f=>f===key?nk:f);s.steps.forEach(x=>{if(x.cond?.f===key)x.cond={...x.cond,f:nk}})}}
      else{const nk=uid('q');FL[nk]=def;s.fields.push(nk)}
      closeModal();toast(key?'Question saved':'Question added');refreshSvc(false)})})}
A.addstep=d=>modal(`<h3>Add a step</h3><p class="sub">Pick what happens next in this service.</p><div class="kinds">${Object.entries(KIND).map(([k,v])=>`<button data-act="pickkind" data-svc="${d.svc}" data-kind="${k}"><span class="ibx"><span class="ms">${v.icon}</span></span><b>${v.label}</b><small>${v.desc}</small></button>`).join('')}</div>`);
A.pickkind=d=>stepEditor(d.svc,null,d.kind);
A.editstep=d=>stepEditor(d.svc,d.id);
function stepEditor(svcId,stepId,kind){
  const s=svcById(svcId);const st=stepId?s.steps.find(x=>x.id===stepId):{kind,name:({form:'More details',quote:'Quotation',upload:'Supporting document',sign:'Declaration letter',team:'Team check',gov:'Authority decision'})[kind]};
  const choices=s.fields.filter(f=>FL[f]?.type==='choice');const cf=st.cond?.f||choices[0];const ce=st.cond?.eq||(cf?FL[cf].opts[0]:'');
  modal(`<h3>${stepId?'Edit step':'New step'} · ${KIND[st.kind].label}</h3><p class="sub">${KIND[st.kind].desc}</p>
  <div class="fld"><label for="se-name">Step name the client sees</label><input id="se-name" value="${esc(st.name)}"></div>
  ${choices.length?`<div class="fld"><label style="display:flex;align-items:center;justify-content:space-between">Only include it when…<button class="tgl ${st.cond?'on':''}" id="se-ctgl" role="switch" aria-checked="${!!st.cond}" aria-label="Use a condition"></button></label>
   <div id="se-cond" style="${st.cond?'':'display:none'}"><div class="opts" id="se-f" style="margin-bottom:10px">${choices.map(f=>`<button class="${f===cf?'on':''}" data-f="${f}">${esc(FL[f].label.replace(/\?$/,''))}</button>`).join('')}</div><div class="opts" id="se-v"></div></div><div class="hint">Conditions use the client's answers, so steps appear only when they apply.</div></div>`:''}
  <div class="row2" style="margin-top:6px">${stepId?`<button class="btn sm sec2 danger" id="se-del"><span class="ms">delete</span>Remove</button>`:''}<button class="btn sm pri" id="se-save">${stepId?'Save':'Add step'}</button></div>`,m=>{
    let useC=!!st.cond,f=cf,v=ce;
    const drawV=()=>{const box=$('#se-v',m);if(!box)return;box.innerHTML=FL[f].opts.map(o=>`<button class="${o===v?'on':''}" data-v="${esc(o)}">${esc(o)}</button>`).join('')};drawV();
    $('#se-ctgl',m)?.addEventListener('click',e=>{useC=!useC;e.currentTarget.classList.toggle('on',useC);e.currentTarget.setAttribute('aria-checked',useC);$('#se-cond',m).style.display=useC?'':'none'});
    $('#se-f',m)?.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;f=b.dataset.f;v=FL[f].opts[0];$$('#se-f button',m).forEach(x=>x.classList.toggle('on',x===b));drawV()});
    $('#se-v',m)?.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;v=b.dataset.v;$$('#se-v button',m).forEach(x=>x.classList.toggle('on',x===b))});
    $('#se-del',m)?.addEventListener('click',()=>{s.steps=s.steps.filter(x=>x.id!==stepId);closeModal();toast('Step removed','delete');refreshSvc(false)});
    $('#se-save',m).addEventListener('click',()=>{const name=$('#se-name',m).value.trim()||st.name;const cond=useC&&f?{f,eq:v}:undefined;
      if(stepId){st.name=name;st.cond=cond;ST.fresh.add(st.id);setTimeout(()=>ST.fresh.delete(st.id),900)}
      else{const ns=S(st.kind,name,{cond});const i=s.steps.findIndex(x=>x.kind==='team'||x.kind==='gov');s.steps.splice(i<0?s.steps.length:i,0,ns);ST.fresh.add(ns.id);setTimeout(()=>ST.fresh.delete(ns.id),900)}
      closeModal();toast(stepId?'Step saved':'Step added · new requests get it');refreshSvc(false)})})}

/* ---------- wiring ---------- */
document.addEventListener('click',e=>{
  const nav=e.target.closest('.nav[data-view]');if(nav){W.view=nav.dataset.view;$('#menu').hidden=true;render(true);return}
  const push=e.target.closest('#wpush');if(push){push.classList.remove('show');const id=push.dataset.req;if(id&&reqById(id)){W.view='requests';W.mode='list';W.sel=id;render(true)}return}
  if(e.target.id==='modal'){closeModal();return}
  const t=e.target.closest('[data-act]');
  if(!e.target.closest('#menu')&&!e.target.closest('[data-act="bizmenu"]'))$('#menu').hidden=true;
  if(!t)return;const a=A[t.dataset.act];if(a){e.preventDefault();a(t.dataset,t)}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#modal').classList.contains('on'))closeModal();$('#menu').hidden=true}});
document.body.classList.add('app');
try{const t=localStorage.getItem('rbw-theme');if(t)setTheme(t)}catch(e){}
seed();ST.unread=0;
render(true);
})();
</script>
